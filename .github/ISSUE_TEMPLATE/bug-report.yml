name: Bug Report
description: Report an issue with VirtualIntelMac.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: To reproduce
      placeholder: |
        "1. Open '...'
        2. Click on '...'
        3. See error"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "A clear and concise description of what you expected to happen."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Add screenshots or screen recordings if applicable."
  - type: textarea
    id: guestinfo
    attributes:
      label: Guest Info
      placeholder: |
        "- OS: Mac OS X 10.6.8"
        "- RAM: 4GB"
        "- CPU Cores: 2 Cores"
    validations:
      required: true
  - type: textarea
    id: hostinfo
    attributes:
      label: Host Info
      placeholder: |
        "- OS: macOS 27.3 Beta (26C5035r)
        - Machine: MacBook Pro M5 Pro (15 core CPU)
        - RAM: 24GB
        - CPU: M5 Pro (15 core CPU)
        - GPU: Integrated"
    validations:
      required: true
  - type: textarea
    id: diags
    attributes:
      label: Diagnostics
      description: "To get diagnostics, go to *VirtualIntelMac -> Settings -> Diagnostics*. Then drag the exported diagnostics here."
      placeholder: ""